 let lang=progress.settings.lang;
 const hk=speechVoices.find(v=>/zh[-_]HK|yue/i.test(v.lang));
 const mandarin=speechVoices.find(v=>/zh[-_]CN|cmn/i.test(v.lang))||speechVoices.find(v=>/^zh/i.test(v.lang));
 let voice=lang==='zh-HK'?hk:mandarin;
 if(!voice&&speechVoices.length){if(!missingVoiceWarned||manual){toast(lang==='zh-HK'?'裝置未提供粵語聲線；遊戲仍可正常操作。':'裝置未提供中文聲線；遊戲仍可正常操作。');missingVoiceWarned=true}return}

function home(){state.screen='home';if('speechSynthesis'in window)speechSynthesis.cancel();const n=total();
 const cards=LEVELS.map((l,i)=>{const d=completed(bank(i+1));return `<button class="level-card" data-level="${i+1}" aria-label="${i+1}關：${l.title}，已完成${d}題，共6題"><div class="level-art">${levelArt(i+1)}<span class="level-index">第 ${i+1} 關${d===6?' ✓':''}</span></div><div class="level-card-copy"><h3>${l.title}</h3><p>${l.sub} · ${d?`${d}/6 題`:'6 題'}</p><span class="level-arrow">${icon(d===6?'refresh':'arrow')}</span></div></button>`}).join('');
 render(`<div class="home-hero"><div class="hero-copy"><div class="eyebrow">一年級 · 中文小冒險</div><h1>和動物朋友，<br>一起<span>說句子。</span></h1><p>看看牠是誰，再看看牠做甚麼。<br>闖過三關，收集你的句子徽章！</p><div class="hero-cta"><button class="primary" id="start-game">${n===18?'再玩一次':n?'繼續冒險':'開始冒險'}${icon('arrow')}</button><span class="tiny-note">3 關・18 題・不限時</span></div></div><div class="hero-art"><img class="hero-image" src="assets/sentence-garden-hero.png" width="1536" height="1024" alt="小貓在花園跑，小兔輕輕跳，小鳥在天空飛" loading="eager"><div class="floating-note"><span class="noun-bg">小貓</span><span class="verb-bg">跑</span>。</div></div></div><div class="lesson-bar"><span class="lesson-label">二素句小祕訣</span><div class="formula"><span class="part noun-bg">誰？</span><span class="plus">＋</span><span class="part verb-bg">做甚麼？</span></div><span class="tiny-note">先說動物，再說事情。</span></div><div class="journey-heading"><h2>選一站，出發吧！</h2><span>已收集 ${n} / 18 顆星星</span></div><div class="level-grid">${cards}</div><div class="home-footer"><span>${icon('hand')}點一點就能玩</span><span>${icon('heart')}答錯可以再試</span><span>${icon('sound')}按喇叭聽一聽</span></div>`);
 $('#start-game').onclick=()=>{
 if(n===18){askReset('重新開始冒險？','會清除這次的星星和答題紀錄，重新開始三關。',()=>{progress.records={};progress.lastLevel=1;save();startLevel(1)});return}
 let next=[1,2,3].find(l=>completed(bank(l))<6)||1;
 if(n&&completed(bank(progress.lastLevel))<6)next=progress.lastLevel;
 startLevel(next);
 };
 $$('.level-card').forEach(b=>b.onclick=()=>startLevel(+b.dataset.level));
}
function startLevel(l,reset=false){
 if(![1,2,3].includes(l))return;
 if(completed(bank(l))===6&&!reset){askReset('再玩這一關？','只會重新計算這一關，其他關卡的星星會保留。',()=>startLevel(l,true));return}
 if(reset){bank(l).forEach(q=>delete progress.records[q.id]);save()}
 stageTransition(`第 ${l} 關・${LEVELS[l-1].title}`,()=>{
 state={screen:'play',level:l,index:0,answered:false,noun:null,verb:null,options:null,group:0,selected:null,slots:[],tokenOrder:[],rightOrder:[],hintShown:false};
 progress.lastLevel=l;save();
 if(l===2){state.group=Q2.slice(0,3).every(q=>rec(q.id).done)?1:0;setupMatch()}
 else{state.index=Math.max(0,bank(l).findIndex(q=>!rec(q.id).done));setupQuestion()}
 });
}
function topHTML(){const l=state.level;return `<div class="play-top"><button class="back-button" id="back-home">${icon('back')}回樂園</button><div class="stage-strip">${LEVELS.map((x,i)=>`<span class="stage-pill ${i+1===l?'current':completed(bank(i+1))===6?'past':''}">${icon(['eye','link','train'][i])}<span>第 ${i+1} 關</span><span class="pill-title">${x.short}</span></span>`).join('')}</div><span class="star-count">${icon('star')}<span id="total-stars">${total()}</span><span class="tiny-note">/ 18</span></span></div>`}
function headingHTML(sub){let l=state.level,list=bank(),done=completed(list);const qn=l===2?`${done} / 6 組完成`:`第 ${state.index+1} / 6 題`;return `<div class="play-heading"><div><h1>${LEVELS[l-1].title}</h1><p>${sub}</p></div><div class="question-indicator"><span id="question-count">${qn}</span><div class="progress-dots">${list.map((q,i)=>`<i class="dot ${rec(q.id).done?'done':l!==2&&i===state.index?'now':''}" aria-hidden="true" data-dot="${q.id}"></i>`).join('')}</div></div></div>`}
function scenePanel(q){return `<div class="scene-panel"><div class="scene-top">${icon('eye')}看看圖</div>${scene(q)}<div class="scene-help"><span>${q.action==='chase'?'看看：誰追着誰？':'仔細看看牠的動作。'}</span><button class="mini-btn" id="read-question">${icon('sound')}聽題目</button></div></div>`}
function actionHTML(){return `<div class="action-row"><div class="feedback" id="feedback" role="status" aria-live="polite">${icon('leaf')}慢慢想，你一定能找到！</div><div class="action-buttons"><button class="secondary" id="hint-btn">${icon('hint')}提示</button><button class="primary" id="check-btn" disabled>我選好了${icon('check')}</button><button class="primary" id="next-btn" hidden style="display:none">下一題${icon('arrow')}</button></div></div>`}
function bindCommon(){
 $('#back-home').onclick=home;
 $('#read-question')?.addEventListener('click',()=>say(state.answered?sentence(current()):instruction(),true));
 $('#hint-btn')?.addEventListener('click',showHint);
 $('#next-btn')?.addEventListener('click',nextQuestion);
}
function instruction(){return state.level===1?'看看圖畫，選出是誰，再選出牠做甚麼。':state.level===2?'先點左邊的動物，再點右邊的動作。請按照圖中的動作配對。':'看看圖畫，把字卡排好，說一句完整的句子。'}
function refreshProgress(){
 const e=$('#total-stars');if(e)e.textContent=total();
 bank().forEach(q=>{const d=$(`[data-dot="${q.id}"]`);if(d&&rec(q.id).done){d.classList.remove('now');d.classList.add('done')}});
 if(state.level===2&&$('#question-count'))$('#question-count').textContent=`${completed(Q2)} / 6 組完成`;
}
function setupQuestion(){state.answered=false;state.hintShown=false;state.noun=null;state.verb=null;state.slots=[];
 const q=current();
 if(state.level===1){state.options={nouns:shuffle(q.nouns),verbs:shuffle(q.verbs)};renderLevel1()}
 else{state.tokenOrder=notInOrder(q.tokens.map((_,i)=>i));state.slots=Array(q.tokens.length).fill(null);renderLevel3()}
}
// ═══ LEVEL 1 · PICTURE → SUBJECT + ACTION ═══
function renderLevel1(){const q=current();
 render(topHTML()+headingHTML('選出「誰」和「做甚麼」，說一句話。')+`<div class="play-area">${scenePanel(q)}<div class="choice-panel"><section class="choice-group noun-group"><h2 class="choice-label"><span class="number">1</span>誰？</h2><div class="choice-row">${state.options.nouns.map(w=>`<button class="word-choice" data-type="noun" data-word="${w}" aria-pressed="false">${w}</button>`).join('')}</div></section><section class="choice-group verb-group"><h2 class="choice-label"><span class="number">2</span>做甚麼？</h2><div class="choice-row">${state.options.verbs.map(w=>`<button class="word-choice" data-type="verb" data-word="${w}" aria-pressed="false">${w}</button>`).join('')}</div></section><div class="sentence-preview" id="sentence-preview" aria-label="你選的句子"><span class="blank">誰？</span><span class="blank">做甚麼？</span><b>。</b></div></div></div>`+actionHTML());
 bindCommon();
 $$('.word-choice').forEach(btn=>btn.onclick=()=>{if(state.answered)return;state[btn.dataset.type]=btn.dataset.word;sound();say(btn.dataset.word);updateChoices()});
 $('#check-btn').onclick=checkLevel1;
}
function updateChoices(){
 $$('.word-choice').forEach(b=>{let chosen=state[b.dataset.type]===b.dataset.word;b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen))});
 $('#sentence-preview').innerHTML=(state.noun?`<span class="preview-word noun-bg pop">${state.noun}</span>`:'<span class="blank">誰？</span>')+(state.verb?`<span class="preview-word verb-bg pop">${state.verb}</span>`:'<span class="blank">做甚麼？</span>')+'<b>。</b>';
 $('#check-btn').disabled=!(state.noun&&state.verb);
}
function feedback(msg,type='retry'){const f=$('#feedback');if(!f)return;f.className=`feedback ${type}`;f.innerHTML=icon(type==='good'?'check':'hint')+msg;announce(f.textContent)}
function checkLevel1(){if(state.answered||!state.noun||!state.verb)return;const q=current(),r=rec(q.id);r.attempts++;save();
 if(state.noun===ANIMALS[q.animal]&&state.verb===ACTIONS[q.action]){successQuestion(q);$$('.word-choice').forEach(b=>b.disabled=true);$('#sentence-preview').classList.add('pop')}
 else{sound('retry');feedback(state.noun!==ANIMALS[q.animal]?'再看看圖片：這是哪一隻動物？':'動物找對了！再看看牠正在做甚麼。');const panel=$(state.noun!==ANIMALS[q.animal]?'.noun-group':'.verb-group');panel.classList.remove('shake');void panel.offsetWidth;panel.classList.add('shake');if(r.attempts>=2)feedback('還差一點！按「提示」，一起找答案。');}
}
// ═══ LEVEL 2 · SIX MATCHES, TWO SMALL BOARDS ═══
function groupQs(){return Q2.slice(state.group*3,state.group*3+3)}
function setupMatch(){state.selected=null;state.hintShown=false;state.answered=false;state.rightOrder=notInOrder(groupQs().map(q=>q.id));renderLevel2()}
function renderLevel2(){const qs=groupQs();
 render(topHTML()+headingHTML('按照圖片，把動物和動作連起來。')+`<div class="matching-intro"><div class="steps"><span><b class="step-n">1</b>點動物</span><span><b class="step-n">2</b>點動作</span></div><span>第 ${state.group+1} / 2 組畫面</span><button class="mini-btn" id="read-match" aria-label="聽配對玩法">${icon('sound')}聽玩法</button></div><div class="match-board" id="match-board"><svg class="match-lines" id="match-lines" aria-hidden="true"></svg><div class="match-column left">${qs.map(q=>`<button class="match-card ${rec(q.id).done?'matched':''}" data-side="left" data-id="${q.id}" aria-label="${ANIMALS[q.animal]}，${rec(q.id).done?'已配對':'選擇動物'}" ${rec(q.id).done?'disabled':''}><div class="match-thumb">${scene(q,{mini:true})}</div><span class="match-word">${ANIMALS[q.animal]}</span><i class="match-connector"></i>${rec(q.id).done?`<i class="tick">${icon('check')}</i>`:''}</button>`).join('')}</div><div class="match-column right">${state.rightOrder.map(id=>{const q=Q2.find(q=>q.id===id);return `<button class="match-card ${rec(q.id).done?'matched':''}" data-side="right" data-id="${q.id}" aria-label="${ACTIONS[q.action]}，${rec(q.id).done?'已配對':'選擇動作'}" ${rec(q.id).done?'disabled':''}><i class="match-connector"></i><span class="action-doodle">${icon('steps')}</span><span class="match-word">${ACTIONS[q.action]}</span>${rec(q.id).done?`<i class="tick">${icon('check')}</i>`:''}</button>`}).join('')}</div></div><div class="match-feedback"><div class="action-row"><div class="feedback" id="feedback" role="status" aria-live="polite">${icon('hand')}先選左邊的一隻動物。</div><div class="action-buttons"><button class="secondary" id="hint-btn">${icon('hint')}提示</button><button class="primary" id="match-next" style="display:none">${state.group===0?'下一組':'完成這一關'}${icon('arrow')}</button></div></div></div>`);
 bindCommon();$('#read-match').onclick=()=>say(instruction(),true);
 $$('.match-card').forEach(b=>b.onclick=()=>selectMatch(b));
 $('#match-next').onclick=()=>{if(!groupQs().every(q=>rec(q.id).done))return;if(state.group===0){state.group=1;setupMatch()}else checkpoint(2)};
 if(qs.every(q=>rec(q.id).done))showMatchNext();
}
function selectMatch(btn){if(btn.disabled)return;const id=btn.dataset.id;
 if(btn.dataset.side==='left'){
 state.selected=id;$$('.match-column.left .match-card').forEach(b=>{b.classList.toggle('selected',b.dataset.id===id);b.setAttribute('aria-pressed',String(b.dataset.id===id))});
 const q=Q2.find(q=>q.id===id);feedback(`已選「${ANIMALS[q.animal]}」。牠在做甚麼？`,'');say(ANIMALS[q.animal]);sound();
 }else{
 if(!state.selected){feedback('先選左邊的動物，再選右邊的動作。');sound('retry');return}
 const left=Q2.find(q=>q.id===state.selected),r=rec(left.id);r.attempts++;
 if(id===state.selected){r.done=true;r.completedAt=new Date().toISOString();save();sound('good');
 const leftButton=$(`.match-card[data-side="left"][data-id="${id}"]`);
 [leftButton,btn].forEach(b=>{b.disabled=true;b.classList.remove('selected');b.classList.add('matched');b.insertAdjacentHTML('beforeend',`<i class="tick pop">${icon('check')}</i>`);b.setAttribute('aria-label',b.textContent.trim()+'，已配對')});
 state.selected=null;feedback(`<span class="success-sentence">${splitSentence(left)}</span>`,'good');if(progress.settings.autoRead)say(sentence(left));refreshProgress();drawLines();confetti();if(groupQs().every(q=>rec(q.id).done))showMatchNext();
 }else{save();sound('retry');feedback('再看看圖中的動作，這一對還未配好。');btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}
 }
}
function drawLines(){const board=$('#match-board'),svg=$('#match-lines');if(!board||!svg)return;const bb=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${bb.width} ${bb.height}`);svg.innerHTML='';groupQs().filter(q=>rec(q.id).done).forEach(q=>{
 const left=$(`.match-card[data-side="left"][data-id="${q.id}"] .match-connector`),right=$(`.match-card[data-side="right"][data-id="${q.id}"] .match-connector`);if(!left||!right)return;function anchor(el){let x=el.offsetWidth/2,y=el.offsetHeight/2;while(el&&el!==board){x+=el.offsetLeft;y+=el.offsetTop;el=el.offsetParent}return{x,y}}const a=anchor(left),b=anchor(right);const x1=a.x,y1=a.y,x2=b.x,y2=b.y,mid=(x1+x2)/2;svg.insertAdjacentHTML('beforeend',`<path d="M${x1} ${y1}C${mid} ${y1},${mid} ${y2},${x2} ${y2}"/>`)
 })}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(drawLines,90)});
function showMatchNext(){state.answered=true;$('#hint-btn').style.display='none';$('#match-next').style.display='inline-flex';feedback(state.group===0?'這三對都配好了！去看看其他動物吧。':'六對全部配好了！你真棒！','good')}
// ═══ LEVEL 3 · TAP OR DRAG TO REORDER ═══
function renderLevel3(){const q=current();
 render(topHTML()+headingHTML('三張字卡，排出「誰＋做甚麼」。')+`<div class="reorder-area">${scenePanel(q)}<div class="reorder-work"><div class="reorder-label">${icon('hand')}把字卡依次放上小列車</div><div class="token-tray" id="token-tray" aria-label="待排列字卡"></div><div class="train"><div class="train-row" id="train-row"></div></div><div class="element-labels three"><span>誰？</span><span>做甚麼？</span></div><p class="reorder-tip">點字卡放上去；點車廂取回來。也可以拖拉。</p><div id="concept-reveal"></div></div></div>`+actionHTML());
 bindCommon();$('#check-btn').innerHTML='排好了'+icon('check');$('#check-btn').onclick=checkLevel3;updateTokens();
}
function updateTokens(){const q=current();
 $('#token-tray').innerHTML=state.tokenOrder.map(i=>`<button class="token ${state.slots.includes(i)?'used':''}" data-token="${i}" draggable="${!state.answered&&!state.slots.includes(i)}" ${state.slots.includes(i)||state.answered?'disabled':''} aria-label="字卡：${q.tokens[i]}">${q.tokens[i]}</button>`).join('');
 $('#train-row').innerHTML=state.slots.map((v,i)=>`<button class="carriage ${i?'predicate':''} ${v!==null?'filled':''}" data-slot="${i}" ${state.answered?'disabled':''} draggable="${v!==null&&!state.answered}" aria-label="第${i+1}個位置，${v===null?'空白':q.tokens[v]+'，按一下取回'}">${v===null?`<span class="slot-no">${i+1}</span>`:q.tokens[v]}</button>`).join('')+'<span class="fullstop">。</span>';
 $$('.token:not(.used)').forEach(b=>{b.onclick=()=>placeToken(+b.dataset.token);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',JSON.stringify({token:+b.dataset.token}));e.dataTransfer.effectAllowed='move'}});
 $$('.carriage').forEach(b=>{
 const idx=+b.dataset.slot;
 b.onclick=()=>{if(state.answered)return;if(state.slots[idx]!==null){state.slots[idx]=null;sound();updateTokens()}};
 b.ondragstart=e=>{if(state.slots[idx]===null){e.preventDefault();return}e.dataTransfer.setData('text/plain',JSON.stringify({token:state.slots[idx],from:idx}));e.dataTransfer.effectAllowed='move'};
 b.ondragover=e=>{if(state.answered)return;e.preventDefault();b.classList.add('dragover')};b.ondragleave=()=>b.classList.remove('dragover');
 b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');if(state.answered)return;try{const p=JSON.parse(e.dataTransfer.getData('text/plain'));placeToken(p.token,idx)}catch(e){}}
 });
 $('#token-tray').ondragover=e=>{if(!state.answered)e.preventDefault()};$('#token-tray').ondrop=e=>{e.preventDefault();if(state.answered)return;try{const p=JSON.parse(e.dataTransfer.getData('text/plain'));let i=state.slots.indexOf(p.token);if(i>=0){state.slots[i]=null;sound();updateTokens()}}catch(e){}};
 $('#check-btn').disabled=state.slots.some(v=>v===null)||state.answered;
}
function placeToken(token,slot=null){if(state.answered||!Number.isInteger(token)||token<0||token>=current().tokens.length)return;const old=state.slots.indexOf(token);let to=slot===null?state.slots.indexOf(null):slot;if(to<0||to>=state.slots.length||old===to)return;if(old>=0){const swap=state.slots[to];state.slots[old]=swap}state.slots[to]=token;sound();say(current().tokens[token]);updateTokens()}
function checkLevel3(){if(state.answered||state.slots.some(v=>v===null))return;const q=current(),r=rec(q.id);r.attempts++;save();if(state.slots.every((v,i)=>v===i)){
 successQuestion(q);updateTokens();$('#concept-reveal').innerHTML=`<div class="concept-reveal pop">${splitSentence(q)}</div>`;
 }else{sound('retry');feedback(state.slots[0]!==0?'先想一想：是誰在做動作？把牠放在最前面。':'動物放對了！再把後面的事情排順。');$('#train-row').classList.remove('shake');void $('#train-row').offsetWidth;$('#train-row').classList.add('shake')}
}
// ═══ SUCCESS, HINTS, RESULTS ═══
function successQuestion(q){state.answered=true;const r=rec(q.id);r.done=true;r.completedAt=new Date().toISOString();save();sound('good');confetti();feedback(`<span class="success-sentence">${splitSentence(q)}</span>`,'good');$('#check-btn').style.display='none';$('#hint-btn').style.display='none';$('#next-btn').hidden=false;$('#next-btn').style.display='inline-flex';$('#next-btn').innerHTML=(completed(bank())===6?'完成這一關':'下一題')+icon('arrow');$('#read-question').innerHTML=icon('sound')+'聽句子';refreshProgress();if(progress.settings.autoRead)say(sentence(q))}
function nextQuestion(){if(!state.answered)return;const list=bank();const next=list.findIndex((q,i)=>i>state.index&&!rec(q.id).done);if(next>=0){state.index=next;setupQuestion()}else{const remaining=list.findIndex(q=>!rec(q.id).done);if(remaining>=0){state.index=remaining;setupQuestion()}else checkpoint(state.level)}}
function showHint(){
 if(state.answered)return;
 let q=state.level===2?Q2.find(q=>q.id===state.selected)||groupQs().find(q=>!rec(q.id).done):current();if(!q)return;
 let r=rec(q.id);r.hints++;save();state.hintShown=true;
 const copy=state.level===1?`這是「${ANIMALS[q.animal]}」。<br>再看看：牠在做甚麼？`:state.level===2?`看，「${ANIMALS[q.animal]}」正在「${ACTIONS[q.action]}」。<br>找找相同的字卡吧！`:`先放「${ANIMALS[q.animal]}」，<br>再放「${ACTIONS[q.action]}」和「${OBJECTS[q.object]}」。`;
 const d=$('#hint-dialog');d.innerHTML=`<div class="dialog-content"><div class="hint-image"><svg viewBox="0 0 200 160" aria-hidden="true">${animal(q.animal,q.action==='sleep',q.action)}</svg></div><h2 id="hint-title">一起找一找</h2><p class="hint-copy">${copy}</p><button class="primary" id="hint-close">我再試試${icon('arrow')}</button></div>`;
 d.showModal();$('#hint-close').onclick=()=>{d.close();if(state.level===1){$(`.word-choice[data-type="noun"][data-word="${ANIMALS[q.animal]}"]`)?.classList.add('hinted')}else if(state.level===2){const btn=$(`.match-card[data-side="left"][data-id="${q.id}"]`);if(btn&&!btn.disabled)selectMatch(btn)}else{$('.carriage')?.classList.add('hinted')}};
 say(copy.replace(/<br>/g,''),true);
}
function checkpoint(l){state.screen='checkpoint';state.level=l;state.answered=true;sound('win');render(topHTML()+`<section class="checkpoint"><div class="eyebrow">第 ${l} 關・任務完成</div><div class="badge-art">${badge(l)}</div><h1>你是${LEVELS[l-1].badge}！</h1><p>${l===1?'你會看圖找出「誰」和「做甚麼」了。':l===2?'你把六隻動物和牠們的動作都配好了。':'你會把字卡排成完整的句子了。'}</p><div class="earned-stars">${Array.from({length:6},(_,i)=>`<span style="--i:${i}">${icon('star')}</span>`).join('')}</div><div class="hero-cta"><button class="primary" id="continue-level">${l<3?`前往第 ${l+1} 關`:'看看我的徽章'}${icon('arrow')}</button><button class="secondary" id="checkpoint-home">回樂園</button></div><p class="score-note">每完成一道題，都值得一顆星星。</p></section>`);$('#back-home').onclick=home;$('#checkpoint-home').onclick=home;$('#continue-level').onclick=()=>{if(l<3){if(completed(bank(l+1))===6){if(l+1===3)finalScreen();else checkpoint(l+1)}else startLevel(l+1)}else finalScreen()};confetti(true);announce(`第${l}關完成。你是${LEVELS[l-1].badge}。`)}
function finalScreen(){state.screen='final';const n=total(),all=n===18;
 render(`<section class="checkpoint"><div class="eyebrow">我的句子探險紀錄</div><div class="badge-art">${badge(3)}</div><h1>${all?'句子樂園，闖關成功！':'你又學會了新句子！'}</h1><p>${all?'三關都完成了，你收集了 18 顆星星。':`已收集 ${n} 顆星星。其他關卡也在等你！`}</p><div class="collection-row">${LEVELS.map((l,i)=>`<div class="collection-item" ${completed(bank(i+1))<6?'style="opacity:.5"':''}><div class="small-badge">${badge(i+1)}</div><strong>${l.badge}</strong><span>${completed(bank(i+1))} / 6 題完成</span></div>`).join('')}</div><div class="lesson-bar" style="justify-content:center;margin:22px auto 0"><span class="lesson-label">記住小祕訣</span><div class="formula"><span class="part noun-bg">誰？</span><span class="plus">＋</span><span class="part verb-bg">做甚麼？</span></div></div><div class="hero-cta"><button class="primary" id="final-home">${all?'回樂園再玩':'回樂園繼續'}${icon('arrow')}</button></div></section>`);$('#final-home').onclick=home;confetti(true);sound('win');announce(all?'三關都完成了！你收集了十八顆星星。':`已完成${n}題。`)}
function askReset(title,copy,callback){const d=$('#confirm-dialog');d.innerHTML=`<div class="dialog-content"><h2 id="confirm-title">${title}</h2><p class="hint-copy" style="font-size:17px">${copy}</p><div class="hero-cta" style="justify-content:center"><button class="secondary" id="reset-cancel">保留進度</button><button class="primary" id="reset-confirm">重新開始</button></div></div>`;d.showModal();$('#reset-cancel').onclick=()=>d.close();$('#reset-confirm').onclick=()=>{d.close();callback()}}
// ═══ GLOBAL CONTROLS ═══
$('#brand-home').onclick=home;
$('#sound-toggle').onclick=()=>{progress.settings.sound=!progress.settings.sound;if(!progress.settings.sound&&'speechSynthesis'in window)speechSynthesis.cancel();save();syncTools();sound()};
$('#motion-toggle').onclick=()=>{progress.settings.motion=!progress.settings.motion;save();syncTools();announce(progress.settings.motion?'動作繼續播放。':'動作已暫停。')};
$('#fullscreen-toggle').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else toast('此裝置未提供全螢幕按鈕；可橫放裝置放大畫面。')}catch(e){toast('未能切換全螢幕；可使用瀏覽器的全螢幕選項。')}};
$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
syncTools();home();
</script>
</body>
</html>
